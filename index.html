<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Work</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #f6f7f9; color: #1c1e21; }
  .card { max-width: 36rem; padding: 2.5rem 3rem; border-radius: 16px;
          background: #fff; box-shadow: 0 8px 30px rgb(0 0 0 / 8%); }
  h1 { margin: 0 0 .5rem; font-size: 1.75rem; }
  p { margin: .5rem 0; color: #4a4f57; }
  code { background: #eef0f3; padding: .1rem .35rem; border-radius: 5px; }
  @media (prefers-color-scheme: dark) {
    body { background: #121417; color: #e8eaed; }
    .card { background: #1b1e23; box-shadow: none; }
    p { color: #a8afb8; }
    code { background: #262a31; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Hello, superagent</h1>
    <p>这是一个给 AI 同事练手的小页面。</p>
    <p>在 Issue 里 <code>@&#8203;ling5717</code> 提一个具体的小改动，它就会开 PR。</p>
  </main>
</body>
</html>
